name: fleetops

description: "A new Flutter project."

publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.13.4

dependencies:
  flutter:
    sdk: flutter

  http: ^1.5.0
  geolocator: ^14.0.2
  flutter_secure_storage: ^9.2.4
  cupertino_icons: ^1.0.8
  google_maps_flutter: ^2.18.2
  flutter_foreground_task: ^11.0.3
  geolocator_android: ^5.1.1
  flutter_map: ^8.3.2
  latlong2: ^0.10.1
  url_launcher: ^6.3.2

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true

flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/icons/icon.png"